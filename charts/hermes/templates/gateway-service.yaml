{{- $targetPort := .Values.gateway.service.port }}
{{- range .Values.gateway.agents }}
{{- if .enabled }}
{{- $targetPort = .port }}
{{- break }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app: hermes-gateway
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ $targetPort }}

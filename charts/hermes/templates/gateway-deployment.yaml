apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-gateway
  template:
    metadata:
      labels:
        app: hermes-gateway
    spec:
      terminationGracePeriodSeconds: 60
      containers:
{{- range $agent := .Values.gateway.agents }}
      {{- if $agent.enabled }}
        - name: {{ $agent.name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
{{- if $agent.profile }}
            - "--profile={{ $agent.profile }}"
{{- end }}
            - "gateway"
            - "run"
          ports:
            - containerPort: {{ $agent.port }}
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            - name: API_SERVER_PORT
              value: {{ $agent.port | quote }}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml $.Values.gateway.resources | nindent 12 }}
      {{- end }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize | quote }}
